{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-50">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-teal-200">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-600">Reset Password</h2>
    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-gray-600 mb-1">Email</label>
        <input type="email" name="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500" required>
      </div>
      <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2 rounded-lg transition-colors duration-200">
        Send Reset Link
      </button>
    </form>
    <p class="text-center mt-4 text-gray-600">
      <a href="{{ url_for('login') }}" class="text-teal-600 font-medium hover:underline">Back to Login</a>
    </p>
  </div>
</div>
{% endblock %}
